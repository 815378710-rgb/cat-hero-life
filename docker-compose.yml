services:
  cat-hero-life:
    build:
      context: .
      dockerfile: Dockerfile
    image: cat-hero-life:${TAG:-2.0.0}
    container_name: cat-hero-life
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # 数据持久化：数据库、上传、TTS、备份全在这里，绝不放容器内
      - /volume1/projects/cat-hero-life/data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/system/health"]
      interval: 60s
      timeout: 10s
      start_period: 40s
      retries: 3
    # 注：日志驱动沿用群晖默认（db），不要覆盖为 json-file，否则与 DSM 日志面板冲突
