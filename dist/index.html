<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>人生管理系统</title>
  <!-- font-awesome 由 main.ts 本地引入（不依赖 cdnjs，国内访问更稳） -->
  <style>
    #lottery-fab{position:fixed;right:14px;bottom:82px;z-index:9000;display:flex;align-items:center;gap:6px;
      padding:10px 15px;border-radius:999px;background:linear-gradient(135deg,#ff6b9d,#a06bff);color:#fff;
      font-size:14px;font-weight:600;line-height:1;text-decoration:none;box-shadow:0 6px 20px rgba(255,107,157,.45);
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
      transition:transform .15s ease;}
    #lottery-fab:active{transform:scale(.94);}
    @media (min-width:900px){#lottery-fab{bottom:24px;}}
    #boot-tip{position:fixed;inset:0;z-index:99999;background:#f4f5fa;display:flex;align-items:center;
      justify-content:center;flex-direction:column;gap:14px;
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
      color:#8a90a3;font-size:14px}
    #boot-tip .emoji{font-size:34px;animation:bounce 1.2s ease-in-out infinite}
    #boot-tip .bar{width:150px;height:3px;border-radius:2px;background:#e9ecf4;overflow:hidden}
    #boot-tip .bar i{display:block;height:100%;width:40%;border-radius:2px;
      background:linear-gradient(90deg,#ff6b9d,#a06bff);animation:slide 1.1s ease-in-out infinite}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
  </style>
  <script type="module" crossorigin src="/assets/index-CKTZ3qqy.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CCDUcCAI.css">
</head>
<body>
  <div id="app"></div>
  <a id="lottery-fab" href="/lottery" title="彩票账本">🎟️ 彩票</a>

  <!--
    首屏自愈引导
    背景：站点经 Cloudflare Tunnel 回源，隧道节点全部落在洛杉矶（lax01-13），
    淄博联通 → CF → 洛杉矶这条链路对 240KB 的主 JS 约有 50% 概率中途断流，
    表现为白屏。这里在主 JS 加载失败或 7 秒内未挂载时，展示加载态并自动重载，
    让用户知道"在加载"而不是"坏了"。
  -->
  <div id="boot-tip">
    <div class="emoji">🐱</div>
    <div id="boot-msg">正在加载…</div>
    <div class="bar"><i></i></div>
  </div>

  <script>
    (function () {
      var mounted = false;
      var retried = Number(sessionStorage.getItem('boot-retry') || 0);

      // 主 JS 加载失败
      window.addEventListener('error', function (e) {
        if (e.target && e.target.tagName === 'SCRIPT' && (e.target.src || '').indexOf('/assets/') >= 0) {
          retry();
        }
      }, true);

      // 超时未挂载
      var guard = setTimeout(function () { if (!mounted) retry(); }, 7000);

      window.__bootReady = function () {
        mounted = true;
        clearTimeout(guard);
        sessionStorage.removeItem('boot-retry');
        var tip = document.getElementById('boot-tip');
        if (tip) tip.remove();
      };

      function retry() {
        if (mounted) return;
        var msg = document.getElementById('boot-msg');
        if (retried >= 2) {
          if (msg) msg.textContent = '网络不太稳定，请手动刷新页面';
          return;
        }
        if (msg) msg.textContent = '网络较慢，正在重试（' + (retried + 1) + '/2）…';
        sessionStorage.setItem('boot-retry', String(retried + 1));
        setTimeout(function () { location.reload(); }, 800);
      }
    })();
  </script>
  <script>
    // 静态资源 Service Worker：复访直接读本地缓存，绕开跨境回源
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
